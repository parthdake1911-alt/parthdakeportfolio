    host.querySelector('.editor-tools').addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
    host.querySelector('.editor-tools').addEventListener('click', (e) => {
      const b = e.target.closest('[data-cmd]'); if (!b) return;
      area.focus();
      if (b.dataset.cmd === 'checklist') document.execCommand('insertHTML', false, '<p>☐ </p>');
      else document.execCommand(b.dataset.cmd, false, null);
      words(); save();
    });
    function renderTpls() {
      host.querySelector('[data-tpls]').innerHTML = A.state.templates.map((tp) => '<button type="button" class="chip" data-tpl="' + tp.id + '">' + A.esc(tp.name) + '</button>').join('') +
        '<button type="button" class="btn btn-ghost btn-sm" data-addtpl style="color:var(--accent)">' + A.icon('plus', 'sm') + 'Add template</button>';
    }
    renderTpls();
    host.querySelector('[data-tpls]').addEventListener('click', (e) => {
      const b = e.target.closest('[data-tpl]');
      if (b) {
        const tp = A.state.templates.find((x) => x.id === b.dataset.tpl);
        area.insertAdjacentHTML('beforeend', tp.html); words(); save();
        area.focus();
        const r = document.createRange(); r.selectNodeContents(area); r.collapse(false);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      }
      if (e.target.closest('[data-addtpl]')) {
        A.modal({
          title: 'New template', subtitle: 'Saved templates appear above every trade note and journal entry.',
          body: '<div style="display:grid;gap:16px"><div class="field"><label for="tp-name">Template name<span class="req">*</span></label><input class="input" id="tp-name" maxlength="40" placeholder="e.g. Opening range checklist"><p class="error-msg" id="tp-err" hidden></p></div>' +
            '<div class="field"><label for="tp-body">Template text<span class="req">*</span></label><textarea class="input" id="tp-body" rows="5" style="height:auto;padding:12px" placeholder="One prompt per line"></textarea></div></div>',
          foot: '<button type="button" class="btn btn-secondary" data-close>Cancel</button><button type="button" class="btn btn-primary" data-ok>Save template</button>',
          mount(el, api) {
            el.querySelector('[data-ok]').onclick = () => {
              const name = el.querySelector('#tp-name').value.trim(), body = el.querySelector('#tp-body').value.trim();
              const err = el.querySelector('#tp-err');
              if (!name || !body) { err.hidden = false; err.innerHTML = A.icon('alert', 'sm') + 'Add a name and at least one line of text.'; el.querySelector(name ? '#tp-body' : '#tp-name').focus(); return; }
              A.state.templates.push({ id: 't' + Date.now(), name, html: '<p><b>' + A.esc(name) + '</b></p><ul>' + body.split('\n').filter(Boolean).map((l) => '<li>' + A.esc(l) + '</li>').join('') + '</ul>' });
              A.save(); api.close(); renderTpls(); A.toast('Template saved');
            };
          }
        });
      }
    });
    return area;
    function tool(cmd, label, icon) { return '<button type="button" class="btn-icon" data-cmd="' + cmd + '" aria-label="' + label + '" data-tip="' + label + '">' + A.icon(icon) + '</button>'; }
  };

  /* ---------- trades list ---------- */
  const T = { sort: { key: 'date', dir: -1 }, page: 0, q: '', selected: new Set() };
  const PER = 15;
  const COLS = [
    { key: 'date', label: 'Date' }, { key: 'symbol', label: 'Symbol' }, { key: 'side', label: 'Side' }, { key: 'status', label: 'Status' },
    { key: 'entryT', label: 'Open → close' }, { key: 'entry', label: 'Entry', r: 1 }, { key: 'exit', label: 'Exit', r: 1 }, { key: 'qty', label: 'Qty', r: 1 },
    { key: 'net', label: 'Net P&L', r: 1 }, { key: 'roi', label: 'Net ROI', r: 1 }, { key: 'strategy', label: 'Strategy' }
  ];
  const val = (t, k) => k === 'roi' ? t.net / (t.entry * t.qty) : k === 'status' ? t.net : k === 'strategy' ? ((A.strategy(t.strategyId) || {}).name || '~') : k === 'date' ? t.date + String(t.entryT).padStart(4, '0') : t[k];
  function listTrades() {
    let ts = A.filteredTrades();
    const q = T.q.trim().toUpperCase();
    if (q) ts = ts.filter((t) => t.symbol.includes(q) || t.id.includes(q) || ((A.strategy(t.strategyId) || {}).name || '').toUpperCase().includes(q));
    const { key, dir } = T.sort;
    ts.sort((a, b) => { const x = val(a, key), y = val(b, key); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
    return ts;
  }
  A.orderedTradeIds = (id) => {
    const ids = listTrades().map((t) => t.id);
    if (!id || ids.includes(id)) return ids;
    // the open trade is hidden by filters: step through every trade instead
    return A.allTrades().sort((a, b) => (a.date === b.date ? b.entryT - a.entryT : a.date < b.date ? 1 : -1)).map((t) => t.id);
  };

  A.views.trades = {
    render() {
      const all = A.filteredTrades();
      const s = A.computeStats(all);
      const ts = listTrades();
      const pages = Math.max(1, Math.ceil(ts.length / PER));
      T.page = Math.min(T.page, pages - 1);
      const pageTs = ts.slice(T.page * PER, T.page * PER + PER);
      const share = s.grossWin + s.grossLoss ? s.grossWin / (s.grossWin + s.grossLoss) : 0;
      const sel = T.selected.size;
      const kt = (label, help, value, viz, sub) => '<div class="card kpi kpi-stack"><div class="kpi-label">' + label + A.info(help) + '</div><div class="kpi-main"><div class="kpi-value">' + value + '</div>' + (viz ? '<div class="kpi-viz">' + viz + '</div>' : '') + '</div>' + (sub ? '<div class="kpi-sub num">' + sub + '</div>' : '') + '</div>';
      const head = '<section class="kpis kpis-4" aria-label="Summary">' +
        kt('Net cumulative P&L', 'Sum of net P&L for the trades below.', '<span class="' + f.cls(s.total) + '" data-count="trades-net" data-value="' + s.total + '" data-fmt="inr">' + f.inr(s.total) + '</span>', '<div style="width:110px">' + A.charts.spark(s.curve.map((c) => c.cum), 110, 40) + '</div>', s.count + ' trades · ' + s.tradingDays + ' days') +
        kt('Profit factor', 'Gross profit divided by gross loss.', f.num(s.pf), A.charts.donut(share, 48), f.inr(s.grossWin) + ' / ' + f.inr(-s.grossLoss)) +
        kt('Trade win %', 'Wins divided by wins plus losses.', f.pct(s.winRate), A.charts.gauge(s.winRate, s.wins, s.losses), s.wins + ' won · ' + s.losses + ' lost · ' + s.be + ' even') +
        kt('Avg win / loss', 'Average winning trade divided by average losing trade.', f.num(s.ratio), '', A.charts.ratioBar(s.avgWin, s.avgLoss)) + '</section>';
      const toolbar = '<div class="row wrap between" style="margin:24px 0 8px;gap:12px">' +
        '<div class="input-affix" style="width:min(320px,100%)"><span class="affix l">' + A.icon('search', 'sm') + '</span><label class="sr-only" for="t-q">Search trades</label><input id="t-q" class="input input-sm pl" type="search" placeholder="Search symbol, strategy or trade ID" value="' + A.esc(T.q) + '"></div>' +
        (sel ? '<div class="row wrap" style="gap:8px" aria-live="polite"><b>' + sel + ' selected</b>' +
          '<button type="button" class="btn btn-secondary btn-sm" data-bulk="review">' + A.icon('check', 'sm') + 'Mark reviewed</button>' +
          '<div class="pop-anchor"><button type="button" class="btn btn-secondary btn-sm" data-bulk="tag" aria-haspopup="menu" aria-expanded="false">' + A.icon('strategy', 'sm') + 'Tag strategy' + A.icon('chevDown', 'sm') + '</button></div>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-bulk="clear">Clear</button></div>'
          : '<span class="hint num">' + ts.length + ' trade' + (ts.length === 1 ? '' : 's') + ' · ' + s.reviewed + ' reviewed</span>') + '</div>';
      let table;
      if (!ts.length) {
        table = A.ui.empty('search', T.q ? 'No trades match “' + T.q + '”' : 'No trades match', T.q ? 'Try a symbol like TCS or INFY, or clear the search.' : 'Change the date range or clear filters.', T.q ? '<button type="button" class="btn btn-secondary" data-clearq>Clear search</button>' : '');
      } else {
        const allOnPage = pageTs.every((t) => T.selected.has(t.id));
        table = '<div class="table-wrap card" style="padding:0 8px"><table class="tbl"><caption class="sr-only">Trades, sorted by ' + T.sort.key + '</caption><thead><tr>' +
          '<th scope="col" style="width:36px"><label class="checkbox"><input type="checkbox" data-all ' + (allOnPage ? 'checked' : '') + ' aria-label="Select all trades on this page"></label></th>' +
          COLS.map((c) => '<th scope="col" class="' + (c.r ? 'r' : '') + '"' + (T.sort.key === c.key ? ' aria-sort="' + (T.sort.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '><button type="button" data-sort="' + c.key + '">' + c.label + (T.sort.key === c.key ? A.icon(T.sort.dir > 0 ? 'chevUp' : 'chevDown', 'sm') : '') + '</button></th>').join('') +
          '<th scope="col"><span class="sr-only">Reviewed</span></th></tr></thead><tbody>' +
          pageTs.map((t) => {
            const roi = t.net / (t.entry * t.qty);
            return '<tr class="clickable" data-trade="' + t.id + '" aria-selected="' + T.selected.has(t.id) + '">' +
              '<td><label class="checkbox"><input type="checkbox" data-sel="' + t.id + '" ' + (T.selected.has(t.id) ? 'checked' : '') + ' aria-label="Select trade ' + t.id + '"></label></td>' +
              '<td>' + f.date(t.date) + '</td><td><a class="sym" href="#trades/' + t.id + '" style="color:var(--text)">' + t.symbol + '</a></td><td>' + A.ui.side(t) + '</td><td>' + A.ui.badge(t) + '</td>' +
              '<td class="muted">' + f.time(t.entryT) + ' → ' + f.time(t.exitT) + '</td><td class="r">' + f.price(t.entry) + '</td><td class="r">' + f.price(t.exit) + '</td><td class="r">' + t.qty + '</td>' +
              '<td class="r ' + f.cls(t.net) + '" style="font-weight:600">' + f.inr(t.net, true) + '</td><td class="r ' + f.cls(roi) + '">' + f.pct(roi) + '</td>' +
              '<td>' + A.ui.stratName(t.strategyId) + '</td><td>' + (t.reviewed ? '<span data-tip="Reviewed" style="color:var(--pos-text)">' + A.icon('check', 'sm') + '</span>' : '') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<nav class="row between wrap" style="margin-top:16px" aria-label="Pagination"><span class="hint num">Showing ' + (T.page * PER + 1) + '–' + Math.min(ts.length, T.page * PER + PER) + ' of ' + ts.length + '</span><div class="row">' +
          '<button type="button" class="btn btn-secondary btn-sm" data-page="-1" ' + (T.page === 0 ? 'disabled' : '') + '>' + A.icon('chevLeft', 'sm') + 'Previous</button>' +
          '<span class="hint num" style="padding:0 8px">Page ' + (T.page + 1) + ' of ' + pages + '</span>' +
          '<button type="button" class="btn btn-secondary btn-sm" data-page="1" ' + (T.page >= pages - 1 ? 'disabled' : '') + '>Next' + A.icon('chevRight', 'sm') + '</button></div></nav>';
      }
      return head + toolbar + table;
    },
    mount(root) {
      A.countUp(root);
      const q = root.querySelector('#t-q');
      let qt;
      if (q) q.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { T.q = q.value; T.page = 0; A.refresh(); const n = document.querySelector('#t-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); });
      root.addEventListener('click', (e) => {
        if (e.target.closest('label.checkbox')) { e.stopPropagation(); return; }
        const s = e.target.closest('[data-sort]');
        if (s) { const k = s.dataset.sort; T.sort = { key: k, dir: T.sort.key === k ? -T.sort.dir : k === 'symbol' || k === 'strategy' ? 1 : -1 }; A.refresh(); return; }
        const p = e.target.closest('[data-page]');
        if (p) { T.page += +p.dataset.page; A.refresh(); root.scrollIntoView(); return; }
        if (e.target.closest('[data-clearq]')) { T.q = ''; A.refresh(); return; }
        const b = e.target.closest('[data-bulk]');
        if (b) { bulk(b); return; }
        const tr = e.target.closest('[data-trade]');
        if (tr && !e.target.closest('a')) A.go('trades/' + tr.dataset.trade);
      });
      root.addEventListener('change', (e) => {
        if (e.target.matches('[data-sel]')) { const id = e.target.dataset.sel; e.target.checked ? T.selected.add(id) : T.selected.delete(id); A.refresh(); }
        if (e.target.matches('[data-all]')) {
          const ids = [...root.querySelectorAll('[data-sel]')].map((x) => x.dataset.sel);
          ids.forEach((id) => (e.target.checked ? T.selected.add(id) : T.selected.delete(id))); A.refresh();
        }
      });
    },
    draw() {}
  };
  function bulk(b) {
    const ids = [...T.selected];
    if (b.dataset.bulk === 'clear') { T.selected.clear(); A.refresh(); return; }
    if (b.dataset.bulk === 'review') {
      ids.forEach((id) => (A.state.reviewed[id] = true)); A.save(); T.selected.clear(); A.refresh();
      A.toast(ids.length + ' trade' + (ids.length === 1 ? '' : 's') + ' marked as reviewed', { action: { label: 'Undo', run() { ids.forEach((id) => delete A.state.reviewed[id]); A.save(); A.refresh(); } } });
      return;
    }
    if (b.dataset.bulk === 'tag') {
      A.popover(b, '<div role="menu">' + A.state.strategies.map((s) => '<button type="button" class="menu-item" role="menuitem" data-tag="' + s.id + '">' + A.esc(s.name) + '</button>').join('') + '<div class="menu-sep"></div><button type="button" class="menu-item" role="menuitem" data-tag="">Remove strategy tag</button></div>', (pop) => {
        pop.addEventListener('click', (e) => {
          const m = e.target.closest('[data-tag]'); if (!m) return;
          const before = {}; ids.forEach((id) => { before[id] = id in A.state.tags ? A.state.tags[id] : undefined; });
          ids.forEach((id) => (A.state.tags[id] = m.dataset.tag || null)); A.save(); A.closePopover(); T.selected.clear(); A.refresh();
          A.toast(m.dataset.tag ? ids.length + ' trade' + (ids.length === 1 ? '' : 's') + ' tagged ' + A.strategy(m.dataset.tag).name : 'Strategy tag removed from ' + ids.length + ' trades', { action: { label: 'Undo', run() {
            ids.forEach((id) => { if (before[id] === undefined) delete A.state.tags[id]; else A.state.tags[id] = before[id]; }); A.save(); A.refresh();
          } } });
        });
      });
    }
  }

  /* ---------- trade review ---------- */
  const TV = { left: 'stats', right: 'chart', notes: 'trade', tf: 5, lines: true, vol: true, replay: null, reveal: null };

  A.views.trade = {
    render(route) {
      const t = A.allTrades().find((x) => x.id === route.id);
      if (!t) return A.ui.empty('alert', 'Trade not found', 'It may have been removed when the demo data was reset.', '<a class="btn btn-primary" href="#trades">Back to trades</a>');
      if (TV.id !== t.id) { TV.id = t.id; TV.reveal = null; stopReplay(); }
      const ids = A.orderedTradeIds(t.id);
      const outside = !A.filteredTrades().some((x) => x.id === t.id);
      const reviewedMap = A.state.reviewed;
      const revCount = ids.filter((id) => reviewedMap[id]).length;
      const nextUnrev = nextUnreviewed(ids, t.id);
      const i = ids.indexOf(t.id);
      const prev = i > 0 ? ids[i - 1] : null, next = i >= 0 && i < ids.length - 1 ? ids[i + 1] : null;
      const day = A.allTrades().filter((x) => x.date === t.date);
      const chk = A.ruleCheck(t, day);
      const ex = A.excursion(t);
      const roi = t.net / (t.entry * t.qty);
      const s = A.strategy(t.strategyId);
      const kv = (k, v, cls) => '<div class="kv"><dt>' + k + '</dt><dd class="' + (cls || '') + '">' + v + '</dd></div>';
      let left;
      if (TV.left === 'stats') {
        left = '<div style="margin:16px 0 8px"><div class="hint">Net P&L</div><div class="kpi-value ' + f.cls(t.net) + '" style="font-size:28px">' + f.inr(t.net, true) + '</div></div><dl style="margin:0">' +
          kv('Side', A.ui.side(t)) + kv('Quantity', t.qty) +
          kv('Charges' + A.info('Brokerage ' + f.inr(t.brokerage, true) + ' + taxes and exchange fees ' + f.inr(t.charges - t.brokerage, true)), f.inr(t.charges, true)) +
          kv('Gross P&L', f.inr(t.gross, true), f.cls(t.gross)) + kv('Net ROI', f.pct(roi), f.cls(roi)) + kv('Position value', f.inr(t.entry * t.qty)) +
          '<div class="kv"><dt><label for="tag-sel">Strategy</label></dt><dd><select id="tag-sel" class="select input-sm" style="width:auto;max-width:160px"><option value="">Untagged</option>' + A.state.strategies.map((x) => '<option value="' + x.id + '"' + (x.id === t.strategyId ? ' selected' : '') + '>' + A.esc(x.name) + '</option>').join('') + '</select></dd></div>' +
          '<div class="kv" style="align-items:flex-start"><dt>Tags</dt><dd><div class="chips" style="justify-content:flex-end;gap:6px">' +
          t.tags.map((g) => '<span class="chip" style="display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;color:var(--text)">' + A.esc(g) + '<button type="button" class="btn-icon" style="width:22px;height:22px" data-rmtag="' + A.esc(g) + '" aria-label="Remove tag ' + A.esc(g) + '">' + A.icon('x', 'sm') + '</button></span>').join('') +
          '<div class="pop-anchor"><button type="button" class="chip" style="height:28px;color:var(--accent);border-style:dashed" data-addtag aria-haspopup="dialog" aria-expanded="false">+ Add tag</button></div></div></dd></div>' +
          kv('MAE / MFE' + A.info('Maximum adverse and favourable excursion: the worst and best open P&L while the trade was live.'), '<span class="neg">' + f.inr(ex.mae) + '</span> / <span class="pos">' + f.inr(ex.mfe) + '</span>') +
          '<div class="kv"><dt id="rate-l">Trade rating</dt><dd><div class="stars" role="radiogroup" aria-labelledby="rate-l">' + [1, 2, 3, 4, 5].map((n) => '<button type="button" role="radio" aria-checked="' + (t.rating === n) + '" aria-label="' + n + ' star' + (n > 1 ? 's' : '') + '" data-rate="' + n + '" class="' + (n <= t.rating ? 'on' : '') + '">' + A.icon('star', 'sm') + '</button>').join('') + '</div></dd></div>' +
          kv('Profit target', f.price(t.target)) + kv('Stop loss', f.price(t.sl)) + kv('Initial risk', f.inr(t.riskRs)) +
          kv('Planned R-multiple', f.num(t.plannedR, 1) + 'R') + kv('Realized R-multiple', f.num(t.realizedR) + 'R', f.cls(t.realizedR)) +
          kv('Average entry', f.price(t.entry)) + kv('Average exit', f.price(t.exit)) +
          kv('Entry time', f.time(t.entryT) + ':00') + kv('Exit time', f.time(t.exitT) + ':00') + kv('Duration', f.dur(t.exitT - t.entryT)) + '</dl>';
      } else if (TV.left === 'strategy') {
        if (!s) left = A.ui.empty('strategy', 'No strategy tagged', 'Tag this trade with a strategy to check it against your rules.', '<button type="button" class="btn btn-secondary btn-sm" data-left="stats">Choose a strategy</button>');
        else {
          const w = A.sessionWindow(s);
          const rows = [
            ['Time window', f.time12(w.from) + ' – ' + f.time12(w.to), t.entryT >= w.from && t.entryT <= w.to],
            ['Direction', s.direction, !(s.direction === 'Long-Only' && t.side === 'SHORT') && !(s.direction === 'Short-Only' && t.side === 'LONG')],
            ['Max trades a day', s.noLimit ? 'No limit' : s.maxTrades, !chk.violations.some((v) => v.startsWith('Over'))],
            ['Stop loss respected', s.slRequired, !t.stopBroken],
            ['Planned reward to risk', '1:' + s.rr, t.plannedR >= s.rr]
          ];
          left = '<div style="margin:16px 0"><a href="#strategy/' + s.id + '" style="font-weight:600;font-size:var(--fs-lg)">' + A.esc(s.name) + '</a><div class="hint">' + s.type + ' · ' + s.segment + '</div></div>' +
            '<dl style="margin:0">' + rows.map(([k, v, ok]) => '<div class="kv"><dt>' + k + '<div class="hint">' + A.esc(String(v)) + '</div></dt><dd>' + (ok ? '<span class="badge win">' + A.icon('check', 'sm') + 'Kept</span>' : '<span class="badge loss">' + A.icon('x', 'sm') + 'Broken</span>') + '</dd></div>').join('') + '</dl>';
        }
      } else {
        left = '<div class="table-wrap" style="margin-top:12px"><table class="tbl compact"><thead><tr><th>Time</th><th>Action</th><th class="r">Qty</th><th class="r">Price</th></tr></thead><tbody>' +
          '<tr><td>' + f.time(t.entryT) + '</td><td>' + (t.side === 'LONG' ? 'Buy' : 'Sell') + '</td><td class="r">' + t.qty + '</td><td class="r">' + f.price(t.entry) + '</td></tr>' +
          '<tr><td>' + f.time(t.exitT) + '</td><td>' + (t.side === 'LONG' ? 'Sell' : 'Buy') + '</td><td class="r">' + t.qty + '</td><td class="r">' + f.price(t.exit) + '</td></tr></tbody></table></div>' +
          '<p class="hint" style="margin-top:12px">Imported from ' + A.esc(A.BROKERS[(A.state.session || {}).broker] || 'your broker') + '. Order ID ' + t.id.replace('T', '2610') + '0042.</p>';
      }
      return '<div class="card" style="padding:16px 20px">' +
        '<div class="trade-bar">' +
        '<a class="btn-icon" href="#trades" aria-label="Back to trades" data-tip="Back to trades">' + A.icon('arrowLeft') + '</a>' +
        '<button type="button" class="btn-icon" data-nav-trade="' + (prev || '') + '" ' + (prev ? '' : 'disabled style="opacity:.35"') + ' aria-label="Previous trade">' + A.icon('chevLeft') + '</button>' +
        '<button type="button" class="btn-icon" data-nav-trade="' + (next || '') + '" ' + (next ? '' : 'disabled style="opacity:.35"') + ' aria-label="Next trade">' + A.icon('chevRight') + '</button>' +
        '<div class="title"><b>' + t.symbol + '</b><span>' + f.dateLong(t.date) + '</span>' + A.ui.badge(t) + '</div>' +
        '<span style="flex:1"></span>' +

(function () {

  function bucketKey(date, g) {

      A.justCreated = clean.id; draft = null;
      A.go('strategy');
      A.toast(status === 'Draft' ? '“' + clean.name + '” saved as a draft' : '“' + clean.name + '” created', { action: { label: 'View', run: () => A.go('strategy/' + clean.id) } });
    }
  }

  /* ---------- detail ---------- */
  A.views.strategyDetail = {
    render(route) {
      const st = A.strategy(route.id);
      if (!st) return A.ui.empty('alert', 'Strategy not found', 'It may have been deleted.', '<a class="btn btn-primary" href="#strategy">Back to strategies</a>');
      const x = stratStats(st.id);
      const kpi = (l, v, cls) => '<div class="card kpi" style="min-height:88px"><div class="kpi-body"><div class="kpi-label">' + l + '</div><div class="kpi-value ' + (cls || '') + '" style="font-size:var(--fs-xl)">' + v + '</div></div></div>';
      return '<div class="row wrap" style="gap:16px;align-items:flex-start;margin-bottom:24px">' +
        '<a class="btn-icon" href="#strategy" aria-label="Back to strategies">' + A.icon('arrowLeft') + '</a>' +
        '<div style="flex:1;min-width:200px"><h2 style="font-size:var(--fs-2xl)">' + A.esc(st.name) + '</h2><span class="status-dot ' + (st.status === 'Draft' ? 'draft' : '') + '">' + st.status + ' · created ' + f.date(st.createdAt) + '</span></div>' +
        '<div class="row wrap"><button type="button" class="btn btn-secondary" data-dup>' + A.icon('copy', 'sm') + 'Duplicate</button><button type="button" class="btn btn-ghost" data-del style="color:var(--neg-text)">Delete</button>' +
        '<a class="btn btn-primary" href="#strategy/edit/' + st.id + '/' + (st.status === 'Draft' ? 1 : 5) + '">' + (st.status === 'Draft' ? 'Finish setup' : 'Edit strategy') + '</a></div></div>' +
        (x.s.count ? '<section class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px">' +
          kpi('Trades', x.s.count) + kpi('Total net P&L', f.inr(x.s.total), f.cls(x.s.total)) + kpi('Win rate', f.pct(x.s.winRate, 1)) + kpi('Profit factor', f.num(x.s.pf)) + kpi('Expectancy', f.inr(x.s.expectancy), f.cls(x.s.expectancy)) + kpi('Rules kept', f.pct(x.adherence, 0)) + '</section>' +
          '<section class="card" style="margin-bottom:32px"><div class="card-head"><h2 class="card-title">Cumulative net P&L</h2></div><div data-chart="sc"></div></section>'
          : '<div class="card" style="margin-bottom:32px">' + A.ui.empty('trades', 'No trades tagged yet', 'New trades that match this strategy are tagged after each sync. You can also tag past trades from the Trades page.', '<a class="btn btn-secondary" href="#trades">Go to trades</a>') + '</div>') +
        review(st, 'detail');
    },
    mount(root, route) {
      const st = A.strategy(route.id); if (!st) return;
      root.addEventListener('change', (e) => {
        if (e.target.matches('[data-block]')) {
          st.blockTrade = e.target.checked; A.save();
          e.target.parentElement.querySelector('span:last-child').textContent = st.blockTrade ? 'On' : 'Off';
          A.toast(st.blockTrade ? 'Block trade is on for ' + st.name : 'Block trade is off for ' + st.name);
        }
      });
      root.addEventListener('click', (e) => {
        if (e.target.closest('[data-dup]')) {
          const c = Object.assign(JSON.parse(JSON.stringify(st)), { id: 's-' + Date.now().toString(36), name: st.name + ' (copy)', status: 'Draft', blockTrade: false, createdAt: A.LAST_DAY });
          A.state.strategies.push(c); A.save(); A.go('strategy/' + c.id); A.toast('Duplicated as a draft');
        }
        if (e.target.closest('[data-del]')) {
          const n = A.allTrades().filter((t) => t.strategyId === st.id).length;
          A.confirm({
            title: 'Delete “' + st.name + '”?', danger: true, ok: 'Delete strategy',
            message: n ? 'Its ' + n + ' tagged trades will become untagged. Your trades and notes are not deleted.' : 'This strategy has no trades. This cannot be undone.',
            onOk() {
              const idx = A.state.strategies.indexOf(st);
              const tagged = A.allTrades().filter((t) => t.strategyId === st.id).map((t) => [t.id, t.id in A.state.tags ? A.state.tags[t.id] : undefined]);
              A.state.strategies.splice(idx, 1);
              tagged.forEach(([id]) => (A.state.tags[id] = null));
              A.save(); A.go('strategy');
              A.toast('“' + st.name + '” deleted', { action: { label: 'Undo', run() {
                A.state.strategies.splice(idx, 0, st);
                tagged.forEach(([id, v]) => { if (v === undefined) delete A.state.tags[id]; else A.state.tags[id] = v; });
                A.save(); A.refresh();
              } } });
            }
          });
        }
      });
    },
    draw(root, route) {
      const el = root.querySelector('[data-chart="sc"]'); if (!el) return;
      const x = stratStats(route.id);
      A.charts.area(el, { height: 240, label: 'Cumulative net P&L', data: x.s.curve.map((c) => ({ label: f.dateShort(c.date), value: c.cum, tip: A.charts.tipHtml([f.dateLong(c.date), ['Cumulative', f.inr(c.cum)]]) })) });
    }
  };
})();

</script>
</body>
</html>
