<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="All In: plan a trip your gang actually takes. Try the app and tell Parth what you think.">
<meta property="og:title" content="All In · try the app">
<meta property="og:description" content="Plan a Goa trip with your gang, from yes to settle up. 4 minutes. Tell Parth what you think.">
<meta property="og:image" content="https://parth-dake.netlify.app/allin/og.jpg">
<meta property="og:url" content="https://parth-dake.netlify.app/allin/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>All In</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F1F5F5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a real phone app. On a phone it fills the screen; on a laptop it sits in a device frame. Light brand theme only, by brand rule. */
:root{
  --bg:#F1F5F5; --card:#FFFFFF; --ink:#10262E; --ink2:#4A5F65; --ink3:#7A8B90; --line:#DCE5E5;
  --pine:#016A6D; --pine2:#01595B; --mint:#DDEFEE; --mint2:#9FD5D1; --sea:#1C9290; --nile:#043E52;
  --tang:#FFA45D; --peach:#FFE4CC; --sunset:#E16A3D; --sunset-t:#A8461F; --cream:#FDF6EE;
  --display:'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --hand:'Kalam', 'Comic Sans MS', cursive;
  --sh:3px 3px 0 var(--ink); --sh4:4px 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#E4EBEB;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
/* device */
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
@media (min-width:600px) and (min-height:700px){
  .device{width:390px;height:min(844px,calc(100% - 40px));border-radius:44px;box-shadow:0 0 0 10px var(--ink),0 0 0 12px #2a3f47,0 30px 60px rgba(16,38,46,.35)}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:var(--bg)}
/* header band */
.band{padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:1.5px solid var(--ink);display:flex;flex-direction:column;gap:10px;flex:none}
.band.peach{background:var(--peach)} .band.mint{background:var(--mint)} .band.teal{background:var(--mint2)} .band.plain{background:var(--bg);border-bottom:0}
.navrow{display:flex;align-items:center;gap:12px;min-height:44px}
.back{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;transition:transform .12s,box-shadow .12s}
.back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.over{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.over.p{color:var(--pine)}
.h1{font-family:var(--display);font-weight:900;font-size:40px;line-height:.95;text-transform:uppercase;letter-spacing:.005em;margin:0;text-wrap:balance}
.h1.xl{font-size:48px}
.sub{color:var(--ink2);font-size:14.5px;margin:0}
.title-sm{font-size:15px;font-weight:600}
/* buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:2px solid var(--ink);background:var(--pine);color:#fff;font-weight:600;font-size:15.5px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s,background .2s;text-decoration:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:var(--card);color:var(--pine)}
.btn.tang{background:var(--tang);color:var(--ink)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--pine);font-weight:600;padding:10px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.ic{width:20px;height:20px;flex:none}
.ic.s{width:16px;height:16px}
/* cards */
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:var(--sh4);padding:16px;position:relative}
.card.flat{box-shadow:none;border:1.5px solid var(--line)}
.card.sel{background:var(--mint);border-color:var(--pine)}
.card.peach{background:var(--peach)}
.card.pine{background:var(--pine);color:#fff}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer}
.opt .ico{width:44px;height:44px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none;border:1.5px solid var(--line)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:#fff}
.sel .radio,.radio.on{background:var(--pine);border-color:var(--pine)}
.radio svg{opacity:0}.sel .radio svg,.radio.on svg{opacity:1}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:#fff}
.dot.on::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--pine)}
.lbl{font-size:14px;font-weight:600;color:var(--ink2)}
.field{width:100%;min-height:52px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:0 16px;font-size:16px;outline:none}
.field:focus{border-color:var(--pine);box-shadow:0 0 0 3px var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;transition:background .15s}
.chip.on{background:var(--mint);border-color:var(--pine);color:var(--pine)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;background:var(--mint);color:var(--ink)}
.tag.peach{background:var(--peach)}.tag.white{background:#fff;border:1px solid var(--line)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;border:0;background:#fff;border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:500}
.seg button.on{background:var(--mint);color:var(--pine);font-weight:600}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--mint);border-radius:14px;padding:14px;font-size:13.5px}
.note.peach{background:var(--peach)}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.num{font-family:var(--display);font-weight:900;font-variant-numeric:tabular-nums}
.divl{border-top:1px solid var(--line)}
/* avatars */
.av{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:#fff}
.av.lg{width:48px;height:48px;font-size:18px}
.av.sm{width:30px;height:30px;font-size:12px}
.av.dash{border-style:dashed;background:transparent}
.avs{display:flex;gap:6px;flex-wrap:wrap}
/* ticket */
.tk{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:var(--sh4);overflow:hidden}
.tk-h{background:var(--pine);color:#fff;padding:12px 16px;display:flex;justify-content:space-between}
.tk-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.tk .city{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase}
.tk .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tk .v{font-weight:600;font-size:15px}
.dash-arrow{flex:1;border-top:2px dashed var(--ink);margin:0 10px;position:relative;top:4px}
.dash-arrow::after{content:"";position:absolute;right:-2px;top:-6px;width:8px;height:8px;border-right:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
/* perks tiers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{border-radius:10px;padding:8px 10px;background:var(--tang);color:var(--ink);border:2px solid transparent;transition:all .4s}
.tier b{font-family:var(--display);font-size:26px;font-weight:900;display:block;line-height:1}
.tier span{font-size:12px}
.tier.off{background:transparent;border:2px dashed var(--tang);color:#fff}
.pill{display:inline-flex;align-items:center;font-family:var(--display);font-weight:900;font-size:18px;background:var(--tang);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;white-space:nowrap}
.seal{display:grid;place-items:center;width:58px;height:58px;font-family:var(--display);font-weight:900;font-size:19px;background:var(--tang);clip-path:polygon(50% 0,61% 9%,75% 6%,80% 20%,94% 25%,91% 39%,100% 50%,91% 61%,94% 75%,80% 80%,75% 94%,61% 91%,50% 100%,39% 91%,25% 94%,20% 80%,6% 75%,9% 61%,0 50%,9% 39%,6% 25%,20% 20%,25% 6%,39% 9%)}
/* photo */
.ph{display:block;width:100%;object-fit:cover;background:#cfdcdc}
.post{border-radius:14px;overflow:hidden;border:2px solid var(--ink);box-shadow:var(--sh4);background:#fff}
.postbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.city2{font-family:var(--display);font-weight:900;font-size:28px;line-height:.95;text-transform:uppercase}
/* nav bar */
.tabs{margin:0 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:var(--sh4);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;gap:2px;flex:none}
.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink)}
.tabs button.on{background:var(--pine);color:#fff}
/* route */
.route{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding-top:4px}
.route::before{content:"";position:absolute;left:10%;right:10%;top:17px;border-top:2px solid var(--line)}
.route .st{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2);width:20%}
.route .c{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.route .done .c{background:var(--pine);border-color:var(--ink);color:#fff}
.route .now .c{background:var(--tang);border-color:var(--ink);color:var(--ink)}
.route .now{color:var(--ink);font-weight:700}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center}
.cal .w{font-family:var(--mono);font-size:11px;color:var(--ink2);padding:4px 0}
.cal button{border:0;background:transparent;height:44px;font-weight:500;font-size:15px;border-radius:0;position:relative}
.cal button.mut{color:#B6C3C5}
.cal button.in{background:var(--mint)}
.cal button.end,.cal button.start{background:var(--pine);color:#fff;border-radius:10px;border:2px solid var(--ink);font-weight:700}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(16,38,46,.45);z-index:20;display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .2s ease}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;border-top:2px solid var(--ink);padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;animation:sheetUp .32s cubic-bezier(.2,.9,.25,1)}
.grab{width:44px;height:5px;border-radius:3px;background:#C5D2D3;align-self:center}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* toast / banner */
.banner{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:var(--sh4);padding:12px 14px;display:flex;gap:12px;align-items:center;animation:dropIn .4s cubic-bezier(.2,1.3,.4,1)}
.banner .app{width:30px;height:30px;border-radius:8px;background:var(--pine);display:grid;place-items:center;flex:none}
@keyframes dropIn{from{transform:translateY(-130%)}to{transform:none}}
.banner.out{animation:dropOut .3s ease forwards}
@keyframes dropOut{to{transform:translateY(-140%)}}
/* motion */
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d,0) * 80ms)}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(var(--r,0deg))}to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
.stampin{animation:stampIn .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:.35s}
@keyframes stampIn{from{opacity:0;transform:scale(2.2) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(-12deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--mint);border-top-color:var(--pine);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check-anim{width:84px;height:84px;border-radius:50%;background:var(--pine);border:3px solid var(--ink);display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.check-anim path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.confetti i{position:absolute;width:10px;height:10px;border-radius:50%;animation:conf 1.8s ease-out forwards}
@keyframes conf{from{transform:translate(0,0) scale(0)}20%{transform:translate(calc(var(--x)*.3),calc(var(--y)*.3)) scale(1)}to{transform:translate(var(--x),calc(var(--y) + 240px)) scale(1) rotate(300deg);opacity:0}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(var(--r,0deg))}}
.pulse{animation:pulseRing 1.6s ease-out infinite}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,164,93,.7)}100%{box-shadow:0 0 0 16px rgba(255,164,93,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
/* swipe card */
.swipe{position:relative;height:330px;margin:4px 6px}
.swipe .sc{position:absolute;inset:0;touch-action:none;user-select:none}
.sbtn{border:2px solid var(--ink);border-radius:50%;box-shadow:var(--sh);display:grid;place-items:center;background:#fff;transition:transform .12s}
.sbtn:active{transform:scale(.92)}
/* lock screen */
.lock{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;padding:calc(60px + env(safe-area-inset-top,0px)) 14px 30px;gap:12px}
.lock .time{font-family:var(--display);font-weight:800;font-size:96px;color:#fff;line-height:.9;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.lock .date{color:#fff;font-weight:600;margin-bottom:22px;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.notif{width:100%;background:rgba(255,255,255,.96);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;text-align:left;box-shadow:var(--sh4)}
/* stories */
.story{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 28px;overflow:hidden}
.bars{display:flex;gap:5px}.bars i{flex:1;height:4px;border-radius:2px;background:rgba(16,38,46,.2);overflow:hidden}.bars i b{display:block;height:100%;width:0;background:var(--ink)}
.dark .bars i{background:rgba(255,255,255,.3)}.dark .bars i b{background:#fff}
.flip{display:flex;gap:8px}
.flip span{width:70px;height:92px;background:var(--tang);color:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--sh4);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:72px;position:relative}
.flip span::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid rgba(16,38,46,.35)}
.polaroid{background:#fff;border:2px solid var(--ink);padding:10px 10px 0;box-shadow:var(--sh4)}
.polaroid img{display:block;width:100%;object-fit:cover}
.polaroid p{font-family:var(--hand);font-size:22px;margin:4px 2px 6px;line-height:1.2}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:52px;border:0;border-radius:12px;background:#fff;font-size:22px;font-weight:500}
.keypad button:active{background:var(--mint)}
.hand{font-family:var(--hand)}
.toggle{width:52px;height:32px;border-radius:999px;border:2px solid var(--ink);background:#fff;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.toggle.on{background:var(--pine)}.toggle.on::after{transform:translateX(20px);background:#fff}
.bar-p{height:10px;border-radius:6px;background:#E3DED6;overflow:hidden;border:1.5px solid var(--ink)}
.bar-p i{display:block;height:100%;background:var(--pine);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
</style>

</head>
<body>
<div class="stage"><div class="device" id="dev"></div></div>

<script>

const stack = []; let curEl = null, curName = null, busy = false;
function build(name, arg){
  const def = SCREENS[name](arg);
  const el = document.createElement('section'); el.className = 'screen'; el.dataset.name = name;
  if (def.bg) el.style.background = def.bg;
  el.innerHTML = def.html; el._def = def; return el;
}
function mount(el){ dev.appendChild(el); if (el._def.after) el._def.after(el); }
function nav(name, arg, how = 'push'){
  if (busy) return; busy = true;
  const el = build(name, arg); const old = curEl;
  if (how === 'push' && curName) stack.push({name:curName, arg:curEl._arg});
  if (how === 'reset') stack.length = 0;
  el._arg = arg; mount(el); curEl = el; curName = name;
  if (old) old._def.leave && old._def.leave(old);
  const done = () => { if (old) old.remove(); busy = false; };
  if (!old || reduce){ done(); return; }
  const o = {duration:how === 'fade' || how === 'reset' ? 260 : 380, easing:'cubic-bezier(.2,.85,.25,1)', fill:'forwards'};
  if (how === 'push'){ old.animate([{transform:'none'},{transform:'translateX(-28%)', filter:'brightness(.92)'}], o); el.animate([{transform:'translateX(100%)'},{transform:'none'}], o).onfinish = done; }
  else if (how === 'back'){ dev.insertBefore(el, old); old.animate([{transform:'none'},{transform:'translateX(100%)'}], o).onfinish = done; el.animate([{transform:'translateX(-28%)'},{transform:'none'}], o); }
  else if (how === 'up'){ el.animate([{transform:'translateY(100%)'},{transform:'none'}], o).onfinish = done; }
  else { el.animate([{opacity:0, transform:'scale(.985)'},{opacity:1, transform:'none'}], o).onfinish = done; }
}
function back(){ const p = stack.pop(); if (p) nav(p.name, p.arg, 'back'); }
dev.addEventListener('click', e => {
  const a = e.target.closest('[data-go]'); if (a){ e.preventDefault(); nav(a.dataset.go, a.dataset.arg, a.dataset.how || 'push'); return; }
  if (e.target.closest('[data-back]')){ back(); return; }
  const t = e.target.closest('[data-tab]'); if (t){ nav(t.dataset.tab, null, 'fade'); }
});

  </div></div>${tabs('money')}`,
  after(el){ el.querySelectorAll('.react').forEach(b => b.onclick = () => { const n = +b.textContent.replace(/\D/g, '') + 1; b.textContent = '👍 ' + n; b.animate([{transform:'scale(1.3)'},{transform:'none'}], 250); }); }});
SCREENS.settle = () => ({html:`${head({bg:'teal', over:'Trip ended Tue, 15 Dec · settle up', title:'3 payments and you’re all square'})}
  <div class="scroll"><div class="pad">
  ${[['K','Karan → Neha','₹1,450'],['P','Priya → Neha','₹900']].map(([k, t, a]) => `<div class="card row" style="padding:12px 14px">${avatar(k === 'K' ? 'Karan' : 'Priya')}<div class="grow"><b>${t}</b><div class="small muted" data-st="${k}">${T.settled[k] ? 'Paid ✓' : 'Waiting'}</div></div><b class="num" style="font-size:24px">${a}</b></div>`).join('')}
  <div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row">${avatar('Neha')}<div class="grow"><b>You → Aman</b><div class="small muted">Your payment</div></div><b class="num" style="font-size:24px">₹300</b></div><button class="btn" id="pay">Pay ₹300 by UPI ${ic('right')}</button></div>
  <div class="note" style="background:#fff;border:1.5px solid var(--line)">${ic('lock')}<span>Paid in cash? Only the person who received it can mark it paid.</span></div>
  <div class="card"><div class="row sp"><span class="over">Settled so far</span><b style="color:var(--pine)" id="sc">0 of 3 paid</b></div><div class="bar-p" style="margin:10px 0"><i id="sb" style="width:3%"></i></div></div>
  </div></div>`,
  after(el){ const upd = n => { el.querySelector('#sc').textContent = n + ' of 3 paid'; el.querySelector('#sb').style.width = (n / 3 * 100) + '%'; };
    el.querySelector('#pay').onclick = () => upiPay(300, 'Aman', 'Settle up · ' + T.place + ' trip', async () => { upd(1); await wait(900); el.querySelector('[data-st="K"]').textContent = 'Paid ✓'; upd(2); banner('Karan paid Neha ₹1,450', '2 of 3 settled', null, 1800); await wait(1500); el.querySelector('[data-st="P"]').textContent = 'Paid ✓'; upd(3); await wait(900); nav('square', null, 'up'); }); }});
SCREENS.square = () => ({bg:'var(--mint)', html:`<div class="scroll"><div style="height:240px;display:grid;place-items:center;border-bottom:1.5px solid var(--ink)"><div class="stampin" style="width:150px;height:150px;border-radius:50%;border:5px solid var(--sunset);display:grid;place-items:center;color:var(--sunset);text-align:center;font-family:var(--display);font-weight:900;font-size:44px;line-height:.85">SETTLED<br><span class="mono" style="font-size:12px">GOA · 18 DEC</span></div></div>
  <div class="pad"><h1 class="h1 xl rise">All square!</h1><p class="sub rise" style="--d:1">${gangSize()} friends, ₹71,400, zero awkward reminders.</p>
  <div class="card rise" style="--d:2"><span class="over" style="display:block;border-bottom:2px dashed var(--ink);padding-bottom:8px">Settle-up receipt · 3 payments</span>${[['Karan → Neha','12 Dec','₹1,450'],['Priya → Neha','16 Dec','₹900'],['You → Aman','18 Dec','₹300']].map(r => `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="radio on" style="width:22px;height:22px">${ic('check','s',3).replace('class="ic s"','class="ic s" style="color:#fff;opacity:1"')}</span><div class="grow"><b>${r[0]}</b><div class="small muted">Paid by UPI · ${r[1]}</div></div><b>${r[2]}</b></div>`).join('')}<div class="row sp" style="padding-top:10px"><span class="over">Trip total</span><span class="num" style="font-size:34px">₹71,400</span></div></div>
  <div class="card peach rise row sp" style="--d:3;box-shadow:none"><b>Gang perks saved the group</b><span class="pill">₹4,000</span></div>
  </div></div><div class="foot" style="background:transparent"><button class="btn" data-go="memories" data-how="fade">See the trip journal</button><button class="link" data-go="wrapped" data-how="up">Watch Trip Wrapped</button></div>`,
  after(){ setTimeout(confetti, 600); }});
SCREENS.memories = () => ({bg:'var(--cream)', html:`<header class="band plain" style="background:var(--cream)"><div class="row sp"><div><div class="small muted">${T.start}–${T.end} Dec · ${gangSize()} friends · 1,248 photos</div><div class="hand" style="font-size:34px;font-weight:700;color:var(--pine);line-height:1">${esc(T.place.toLowerCase())} ’26</div></div><button class="back" aria-label="Add photos">${ic('plus')}</button></div>
  <div class="row" style="gap:6px;background:#fff;border-radius:12px;padding:4px"><button class="btn sm" style="width:auto;padding:0 18px;box-shadow:none">Album</button><button class="link" style="width:auto">Photos of you</button><button class="link" style="width:auto" data-go="wrapped" data-how="up">Wrapped</button></div></header>
  <div class="scroll"><div class="pad" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  ${[['gokarna','sunset at vagator',-3],['pondy','the scooty gang',2],['palolem','bonfire, night 2',-2],['bonfire','anjuna flea market',3],['scooters','sunrise hike',-1]].map((p, i) => `<div class="polaroid pop" style="--d:${i};--r:${p[2]}deg;padding:7px 7px 0;${i === 4 ? 'grid-column:1/-1;width:62%;justify-self:center' : ''}"><img src="${IMG[p[0]]}" alt="${p[1]}" style="height:${i === 4 ? 150 : 120}px"><p style="font-size:17px">${p[1]}</p></div>`).join('')}
  </div></div><div class="foot" style="background:var(--cream);padding-bottom:8px"><button class="btn" data-go="wrapped" data-how="up">Watch Trip Wrapped ${ic('right')}</button></div>${tabs('memories')}`});

/* Trip Wrapped stories */
SCREENS.wrapped = () => ({html:`<div id="st" style="position:absolute;inset:0"></div>`,
  after(el){
    const S = [
      {bg:'var(--tang)', dark:false, h:`<div style="flex:1;position:relative"><svg viewBox="0 0 340 420" style="width:100%;height:100%"><path id="road" d="M330 20 C 230 40, 200 90, 260 140 S 320 260, 200 300 S 20 330, -10 410" fill="none" stroke="#10262E" stroke-width="52" stroke-linecap="round"/><path d="M330 20 C 230 40, 200 90, 260 140 S 320 260, 200 300 S 20 330, -10 410" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round"/><text font-family="Big Shoulders Display, Impact" font-weight="900" font-size="26" fill="#10262E" dy="9"><textPath href="#road" startOffset="4%">${esc(T.place.toUpperCase())} ’26 · ${gangSize()} FRIENDS · ${days()} DAYS · ${esc(T.place.toUpperCase())} ’26 · ${gangSize()} FRIENDS</textPath></text></svg></div><span class="over">${T.start} – ${T.end} Dec 2026</span><h1 class="h1" style="font-size:52px;margin-top:6px">Your ${esc(T.place)} trip, wrapped</h1>`},
      {bg:'var(--pine)', dark:true, h:`<span class="over" style="color:#fff;margin-top:30px">Photos taken by the gang</span><div class="flip" id="flip" style="margin:16px 0 22px">${'<span>0</span>'.repeat(4)}</div><h1 class="h1" style="font-size:54px;color:#fff">Shots in four days</h1><p style="color:#fff;font-size:16px">Karan took 312 of them. Nobody is surprised.</p><div style="position:relative;flex:1"><div class="polaroid pop" style="--r:-8deg;position:absolute;left:0;bottom:10px;width:46%"><img src="${IMG.palolem}" alt="" style="height:110px"><p style="font-size:16px">vagator</p></div><div class="polaroid pop" style="--d:2;--r:6deg;position:absolute;right:0;bottom:0;width:46%"><img src="${IMG.bonfire}" alt="" style="height:110px"><p style="font-size:16px">night 2</p></div></div>`},
      {bg:'var(--mint)', dark:false, h:`<span class="over p" style="margin-top:30px">On scooters, along the coast</span><div class="row" style="align-items:flex-end;gap:10px"><span class="num" id="km" style="font-size:150px;line-height:.85;color:var(--pine)">0</span><span class="num" style="font-size:44px;color:var(--pine)">KM</span></div><svg viewBox="0 0 340 360" style="flex:1;width:100%"><path d="M0 0 H110 C 90 90, 130 200, 100 360 H0Z" fill="#1C9290" stroke="#10262E" stroke-width="2"/><path id="trail" d="M250 30 C 200 60, 200 150, 190 200 S 210 290, 250 330" fill="none" stroke="#10262E" stroke-width="4" stroke-dasharray="500" stroke-dashoffset="500"><animate attributeName="stroke-dashoffset" from="500" to="0" dur="2.2s" fill="freeze"/></path>${[[250,30,'Anjuna'],[194,190,'Vagator'],[212,290,'Palolem']].map(([x, y, t]) => `<circle cx="${x}" cy="${y}" r="9" fill="#FFA45D" stroke="#10262E" stroke-width="2.5"/><text x="${x + 14}" y="${y + 5}" font-family="IBM Plex Sans" font-weight="600" font-size="15" fill="#10262E">${t}</text>`).join('')}</svg>`},
      {bg:'var(--cream)', dark:false, h:`<span class="over" style="margin-top:30px">The moment everyone saved</span><div class="polaroid pop" style="--r:-3deg;margin:22px 8px;position:relative"><span class="seal" style="position:absolute;left:-18px;top:-18px;background:var(--sunset)"></span><img src="${IMG.scooters}" alt="Friends on scooters" style="height:230px"><p style="font-size:28px">the scooty gang</p></div><div class="row" style="margin-top:auto;gap:14px"><span style="color:var(--sunset)">${ic('heart').replace('class="ic "','class="ic" style="width:48px;height:48px;fill:#E16A3D"')}</span><div><div class="num" style="font-size:64px;line-height:.9">7 of 8</div><div class="muted">saved it to their phone</div></div></div>`},
      {bg:'var(--peach)', dark:false, h:`<h1 class="h1" style="font-size:46px;margin-top:22px">Who you were on this trip</h1><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">${[['Neha','The Planner','made it happen'],['Rahul','The Treat Giver','3 rounds on him'],['Karan','The Photographer','312 shots'],['Priya','The DJ','12 hours of music']].map((r, i) => `<div class="card row pop" style="--d:${i * 2};padding:10px 14px">${avatar(r[0])}<div><b>${r[0]} · ${r[1]}</b><div class="small muted">${r[2]}</div></div></div>`).join('')}</div><div style="margin-top:auto;display:flex;flex-direction:column;gap:10px;position:relative;z-index:3"><button class="btn" id="fbgo">Rate this app for Parth ${ic('star','s')}</button><button class="btn sec" id="again">Start again</button></div>`}
    ];
    const host = el.querySelector('#st'); let i = 0, timer = null, t0 = 0, raf = 0;
    const DUR = 5200;
    const render = () => {
      const s = S[i]; host.innerHTML = `<div class="story ${s.dark ? 'dark' : ''}" style="background:${s.bg}"><div class="bars">${S.map((_, k) => `<i><b style="width:${k < i ? 100 : 0}%"></b></i>`).join('')}</div><div class="row sp" style="margin-top:12px;color:${s.dark ? '#fff' : 'var(--ink)'}"><span class="over">${esc(T.place)} ’26 · Wrapped</span><button data-x style="border:0;background:none;color:inherit" aria-label="Close">${ic('x')}</button></div>${s.h}<button data-prev aria-label="Previous" style="position:absolute;left:0;top:80px;bottom:120px;width:30%;border:0;background:transparent"></button><button data-next aria-label="Next" style="position:absolute;right:0;top:80px;bottom:120px;width:40%;border:0;background:transparent"></button></div>`;
      host.querySelector('.story').animate([{opacity:0},{opacity:1}], 260);
      if (i === 1){ const sp = host.querySelectorAll('#flip span'); const tgt = '1248'; let k = 0; const it = setInterval(() => { k++; sp.forEach((x, j) => x.textContent = k > 10 + j * 4 ? tgt[j] : Math.floor(Math.random() * 10)); if (k > 24) clearInterval(it); }, 60); }
      if (i === 2){ const km = host.querySelector('#km'); let st = null; const step = ts => { if (!st) st = ts; const p = Math.min(1, (ts - st) / 1600); km.textContent = Math.round(412 * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
      host.querySelector('[data-x]').onclick = () => { stop(); nav('memories', null, 'fade'); };
      host.querySelector('[data-prev]').onclick = () => { if (i > 0){ i--; start(); } };
      host.querySelector('[data-next]').onclick = () => next();
      const fb = host.querySelector('#fbgo'); if (fb) fb.onclick = () => { stop(); nav('feedback', null, 'up'); };
      const ag = host.querySelector('#again'); if (ag) ag.onclick = () => { stop(); location.reload(); };
    };
    const next = () => { if (i < S.length - 1){ i++; start(); } else stop(); };
    const stop = () => { cancelAnimationFrame(raf); };
    const start = () => { stop(); render(); if (i === S.length - 1){ const b = host.querySelectorAll('.bars b')[i]; b.style.width = '100%'; return; } t0 = performance.now(); const bar = host.querySelectorAll('.bars b')[i];
      const tick = now => { const p = Math.min(1, (now - t0) / DUR); bar.style.width = (p * 100) + '%'; if (p < 1) raf = requestAnimationFrame(tick); else next(); }; raf = requestAnimationFrame(tick); };
    start(); el._stop = stop;
  },
  leave(el){ el._stop && el._stop(); }});

/* feedback */
SCREENS.feedback = () => ({html:`${head({bg:'peach', over:'2 minutes · for Parth', title:'How did All In feel?', sub:'Honest is better than nice. This goes straight to Parth on WhatsApp.'})}
  <div class="scroll"><div class="pad" id="fbf">
  <span class="lbl">Overall, out of 5</span><div class="chips" data-k="rating">${[1,2,3,4,5].map(n => `<button class="chip" data-v="${n}" style="min-width:52px">${n}</button>`).join('')}</div>
  <span class="lbl">Did it feel like a real app?</span><div class="chips" data-k="real">${['Totally','Mostly','Not really'].map(v => `<button class="chip" data-v="${v}">${v}</button>`).join('')}</div>
  <span class="lbl">Would you use it for your next gang trip?</span><div class="chips" data-k="use">${['Yes','Maybe','No'].map(v => `<button class="chip" data-v="${v}">${v}</button>`).join('')}</div>
  <span class="lbl">Best part</span><div class="chips" data-k="best">${['Saying yes','My share','Gang perks','Live map','Settle up','Wrapped','The look'].map(v => `<button class="chip" data-v="${v}">${v}</button>`).join('')}</div>
  <label class="lbl" for="conf">What confused you or felt missing?</label><input class="field" id="conf" placeholder="e.g. I didn’t get the ₹500 hold">
  <label class="lbl" for="nm">Your name (optional)</label><input class="field" id="nm">
  </div></div><div class="foot"><button class="btn" id="send">Send to Parth on WhatsApp ${ic('msg','s')}</button></div>`,
  after(el){ el.querySelectorAll('[data-k]').forEach(box => box.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; T.fb[box.dataset.k] = b.dataset.v; box.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); }));
    el.querySelector('#send').onclick = () => {
      if (!T.fb.rating){ const r = el.querySelector('[data-k=rating]'); r.classList.add('shake'); setTimeout(() => r.classList.remove('shake'), 400); banner('Pick a rating first', 'Tap a number from 1 to 5.', null, 2000); return; }
      const nm = el.querySelector('#nm').value.trim(), cf = el.querySelector('#conf').value.trim();
      const txt = `All In review${nm ? ' from ' + nm : ''}\nRating: ${T.fb.rating}/5\nFelt like a real app: ${T.fb.real || '-'}\nWould use it: ${T.fb.use || '-'}\nBest part: ${T.fb.best || '-'}\nConfusing or missing: ${cf || '-'}`;
      const url = 'https://wa.me/' + FEEDBACK_WA + '?text=' + encodeURIComponent(txt);
      sheet(`<h2 style="margin:0">Thank you!</h2><div style="white-space:pre-wrap;background:#fff;border-radius:12px;padding:12px;font-size:14px;border:1.5px solid var(--line)">${esc(txt)}</div><a class="btn" href="${url}" target="_blank" rel="noopener">Open WhatsApp ${ic('right')}</a><button class="btn sec" id="cp">Copy review</button><p class="small muted" style="margin:0">If WhatsApp doesn’t open, copy it and send it to Parth.</p>`, s => {
        s.querySelector('#cp').onclick = async e => { try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Copied ✓'; } catch(err){ e.target.textContent = 'Select the text above to copy'; } };
      });
    }; }});

nav('splash', null, 'fade');
})();
</script>
