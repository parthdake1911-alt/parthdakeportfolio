<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Making Customers Smile — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#e9eef5;display:flex;justify-content:center;align-items:flex-start;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0f1b2d}
  .device{position:relative;width:393px;height:852px;flex-shrink:0;overflow:hidden;overflow:clip;background:#edf3fc;isolation:isolate}
  @media (max-width:392px){ body{display:block} .device{width:100%} }
  .device{height:min(852px,100vh);height:min(852px,100dvh);max-width:100vw}
  @media (max-width:500px){ body{display:block} .device{width:100%} }
  .scr{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#edf3fc;
    transition:transform .38s cubic-bezier(.2,.8,.2,1), opacity .25s ease, filter .38s}
  .scr.off{visibility:hidden;pointer-events:none}
  .scr.right{transform:translateX(100%)}
  .scr.left{transform:translateX(-28%);filter:brightness(.92)}
  .scr.fade{opacity:0}
  .scr.top{z-index:5;box-shadow:-12px 0 30px -12px rgba(15,27,45,.25)}
  .boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:13px;color:#5b6472;z-index:20;transition:opacity .3s}
  .boot i{width:28px;height:28px;border-radius:50%;border:3px solid #c9dcfd;border-top-color:#195EBE;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Share chooser, shown over any tab except Home (Home has its own) */
  .s-bg{position:absolute;inset:0;background:rgba(10,24,45,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
  .s-sh{position:absolute;left:0;right:0;bottom:0;z-index:51;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(180deg,#fff 0%,#f3f8fb 100%);border-radius:28px 28px 0 0;box-shadow:0 -12px 40px rgba(10,24,45,.25);padding:10px 20px 28px}
  .s-open .s-bg{opacity:1;pointer-events:auto}
  .s-open .s-sh{transform:none}
  .grab{display:block;width:40px;height:4px;border-radius:4px;background:rgba(15,27,45,.15);margin:0 auto 14px}
  .s-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .s-t{font-size:17px;font-weight:700}
  .s-s{font-size:13px;color:#5b6472;margin-top:3px}
  .s-x{width:32px;height:32px;border-radius:50%;border:none;background:rgba(15,27,45,.06);font-size:20px;line-height:1;cursor:pointer}
  .ch{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:14px;border-radius:20px;border:1px solid rgba(25,94,190,.12);background:#fff;
    box-shadow:0 6px 18px -8px rgba(29,97,225,.25);cursor:pointer;text-align:left;font-family:inherit;color:#0f1b2d}
  .ch:first-of-type{margin-top:18px}
  .ch-ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ch-ic.sun{background:#fff6d6}
  .ch-ic.grad{background:linear-gradient(135deg,#008632,#195EBE);color:#fff}
  .ch-b{flex:1}
  .ch-b b{display:block;font-size:16px;font-weight:600}
  .ch-b span{display:block;font-size:13px;color:#5b6472;margin-top:2px}
  .ch-go{width:30px;height:30px;border-radius:50%;background:#eef3fb;display:flex;align-items:center;justify-content:center;color:#195EBE}

  .p-toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);z-index:60;background:rgba(15,27,45,.92);color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1)}
  .p-toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){.scr{transition:none}}
</style>
</head>
<body>
<div class="device" id="dev">
  <div class="boot" id="boot"><i></i>Loading prototype…</div>

  <div class="s-bg" id="sbg"></div>
  <div class="s-sh" role="dialog" aria-modal="true" aria-label="Share">
    <span class="grab"></span>
    <div class="s-h"><div><p class="s-t">What would you like to share?</p><p class="s-s">Pick one to get started.</p></div><button class="s-x" id="sx" aria-label="Close">&times;</button></div>
    <button class="ch" data-m="smile"><span class="ch-ic sun"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M13.9 2 5.2 13.1c-.4.5 0 1.1.6 1.1h4.8l-1.8 7.3c-.1.7.7 1 1.1.5l8.9-11.2c.4-.5 0-1.1-.6-1.1h-4.9l1.9-7.1c.2-.7-.7-1-1.3-.6z" fill="#f6b80d"/></svg></span><span class="ch-b"><b>Share a smile</b><span>Tell us who made a customer smile.</span></span><span class="ch-go">›</span></button>
    <button class="ch" data-m="practice"><span class="ch-ic grad"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg></span><span class="ch-b"><b>Share a best practice</b><span>A way of working others can learn from.</span></span><span class="ch-go">›</span></button>
  </div>
  <div class="p-toast" id="pt" role="status" aria-live="polite"></div>
</div>

<script id="screens" type="application/json">{"home":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Smile \u2014 Home<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap\" rel=\"stylesheet\">\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { background: #f0f0f0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: 'Inter', sans-serif; }\n  .phone-wrap { position: relative; width: 393px; background: white; overflow-x: hidden; }\n\n  :root{--blue:#1d61e1;--blue-deep:#195EBE;--teal:#008632;--teal-deep:#0d3f4a;--sun:#f6cc45;--sun-hi:#ffdc6b;--ink:#0f1b2d;--mute:#5b6472;--tint:#eaf1fe;--coral:#ff5257;}\n  button{font-family:inherit}\n  .tap{transition:transform .18s ease, box-shadow .18s ease}\n  .tap:active{transform:scale(.97)}\n  /* Hero */\n  .hero-bg{background:\n      radial-gradient(34% 26% at 92% 0%, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 70%),\n      radial-gradient(55% 42% at 12% 8%, #1fbf62 0%, rgba(31,191,98,0) 72%),\n      radial-gradient(60% 55% at 0% 62%, #008632 0%, rgba(0,134,50,0) 72%),\n      radial-gradient(55% 45% at 72% 40%, #3d8cf5 0%, rgba(61,140,245,0) 70%),\n      radial-gradient(45% 35% at 42% 78%, rgba(120,182,255,.55) 0%, rgba(120,182,255,0) 70%),\n      radial-gradient(80% 60% at 100% 100%, #195EBE 0%, rgba(25,94,190,0) 75%),\n      linear-gradient(140deg,#0a9e4c 0%,#16a07a 30%,#2a7fe0 62%,#195EBE 100%) !important;\n    border-radius:0 0 28px 28px;}\n  .swoosh img{clip-path:inset(0 100% 0 0);animation:draw .8s .35s cubic-bezier(.6,0,.2,1) forwards}\n  @keyframes draw{to{clip-path:inset(0 0 0 0)}}\n  .smile-emoji{cursor:pointer;animation:wave 1s .9s ease-in-out 1}\n  @keyframes wave{0%,100%{transform:rotate(-2.46deg)}20%{transform:rotate(-16deg) scale(1.08)}45%{transform:rotate(10deg) scale(1.08)}70%{transform:rotate(-6deg)}}\n  .cta-sun{background:linear-gradient(180deg,var(--sun-hi) 0%,var(--sun) 100%) !important;border:none !important;\n    box-shadow:0 10px 24px -6px rgba(246,204,69,.65), inset 0 -2px 0 rgba(0,0,0,.06);}\n  .cta-sun p{font-weight:600 !important}\n  .cta-sun:active{transform:translateX(-50%) scale(.97) !important}\n  /* Burst */\n  .burst{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:200}\n  /* Story stack */\n  .story{position:absolute;left:50%;width:299px;background:white;border-radius:24px;box-shadow:12px 12px 24px 0 rgba(29,97,225,0.15);padding:16px;overflow:hidden;\n    transition:transform .5s cubic-bezier(.3,.7,.2,1), top .5s, opacity .3s, box-shadow .3s;touch-action:pan-y;user-select:none}\n  .story.p0{top:15px;transform:translateX(-50%);z-index:3;cursor:grab}\n  .story.p1{top:9px;transform:translateX(calc(-50% - 25.52px)) rotate(-1.5deg);z-index:2}\n  .story.p2{top:7px;transform:translateX(calc(-50% + 27.48px)) rotate(1.5deg);z-index:1}\n  .story.p1 .story-actions,.story.p2 .story-actions{visibility:hidden}\n  .story.fly{transform:translateX(-160%) rotate(-12deg) !important;opacity:0}\n  .story .ph{height:170px;border-radius:16px;overflow:hidden;position:relative;margin-bottom:12px}\n  .story .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}\n  .chip{position:absolute;left:10px;top:10px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.15)}\n  .read-btn{flex:1;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--blue);border-radius:12px;cursor:pointer;background:white;color:var(--blue);font-size:16px;font-weight:600}\n  .like{height:48px;min-width:72px;padding:0 14px;gap:6px;background:var(--tint);border:1px solid rgba(29,97,225,.25);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--blue);font-size:14px;font-weight:600}\n  .like svg{width:20px;height:20px;transition:transform .2s}\n  .like svg path{fill:transparent;stroke:var(--blue);stroke-width:2;transition:fill .2s,stroke .2s}\n  .like.on{background:#fff0f0;border-color:rgba(255,82,87,.35);color:var(--coral)}\n  .like.on svg path{fill:var(--coral);stroke:var(--coral)}\n  .like.pop svg{animation:pop .4s}\n  @keyframes pop{40%{transform:scale(1.35)}100%{transform:scale(1)}}\n  .dots{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:6px}\n  .dots span{cursor:pointer;width:6px;height:6px;border-radius:999px;background:#c9d6ee;transition:width .3s,background .3s}\n  .dots span.on{width:20px;background:var(--blue)}\n  /* Programme */\n  .prog{transition:transform .18s, box-shadow .2s}\n  .prog:active{transform:scale(.98)}\n  .prog .sub{font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}\n  .chev{width:30px;height:30px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}\n  /* Q2 */\n  .bar{background:rgba(255,255,255,.22) !important;border-radius:999px !important;height:12px !important;overflow:hidden}\n  .bar .fill{width:0;border-radius:999px !important;transition:width 1.2s cubic-bezier(.3,.7,.2,1);\n    background:repeating-linear-gradient(-45deg,var(--sun) 0 10px,var(--sun-hi) 10px 20px) !important;background-size:28px 28px !important;animation:stripe 1.2s linear infinite}\n  @keyframes stripe{to{background-position:28px 0}}\n  .q2-meta{display:flex;justify-content:space-between;align-items:center}\n  .days{background:var(--sun);color:var(--ink);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}\n  /* Draft pill */\n  .draft{background:var(--tint) !important}\n  .draft .pulse{width:8px;height:8px;border-radius:50%;background:var(--blue);position:relative}\n  .draft .pulse:after{content:\"\";position:absolute;inset:0;border-radius:50%;background:var(--blue);animation:ring 1.8s ease-out infinite}\n  @keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(3);opacity:0}}\n  /* Toggle */\n  .seg{position:relative;background:white;border-radius:12px;padding:3px;display:flex;box-shadow:0 4px 12px rgba(37,99,235,0.15)}\n  .seg .knob{position:absolute;top:3px;bottom:3px;left:3px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-deep));box-shadow:0 4px 10px rgba(29,97,225,.35);transition:left .35s cubic-bezier(.3,.7,.2,1),width .35s}\n  .seg button{position:relative;z-index:1;border:none;background:transparent;padding:7px 14px;font-size:12px;color:var(--mute);cursor:pointer;transition:color .3s}\n  .seg button.on{color:white;font-weight:600}\n  /* Podium */\n  .pillar{transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.3,.7,.2,1)}\n  .podium.up .pillar{transform:scaleY(1)}\n  .podium.up .pl-2 .pillar{transition-delay:.15s}\n  .podium.up .pl-3 .pillar{transition-delay:.3s}\n  .who{transition:opacity .25s, transform .25s}\n  .swap .who{opacity:0;transform:translateY(6px)}\n  .pts{font-size:11px;color:var(--mute);line-height:14px}\n  .pl-1 .pts{color:#b8860b;font-weight:600}\n  .crown-glow{position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(246,204,69,.55),rgba(246,204,69,0) 70%);animation:glow 2.4s ease-in-out infinite}\n  @keyframes glow{50%{transform:scale(1.15);opacity:.6}}\n  /* FAB */\n  .fab{transition:padding .3s, gap .3s, box-shadow .3s}\n  .fab .lbl{display:inline-block;max-width:60px;overflow:hidden;white-space:nowrap;transition:max-width .3s, opacity .2s}\n  .fab.mini{padding:14px !important;gap:0 !important}\n  .fab.mini .lbl{max-width:0;opacity:0}\n\n  /* ===== v3: rounder, softer, more playful ===== */\n  .hero-bg{border-radius:0 !important}\n  .wave{position:absolute;left:0;top:324px;width:393px;height:36px;z-index:3;pointer-events:none}\n  .floaty{position:absolute;z-index:3;pointer-events:none;animation:floaty 5s ease-in-out infinite}\n  .floaty.b{animation-duration:6.5s;animation-delay:-2s}.floaty.c{animation-duration:4.2s;animation-delay:-1s}\n  @keyframes floaty{50%{transform:translateY(-8px) rotate(12deg)}}\n  .streak{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:white;font-size:12px;font-weight:700;padding:6px 10px 6px 8px;border-radius:999px;backdrop-filter:blur(6px)}\n  .streak svg{width:14px;height:14px}\n  .cta-sun{border-radius:999px !important}\n  .cta-sun .thumb{animation:thumb 3s 1.6s ease-in-out infinite;transform-origin:50% 80%}\n  @keyframes thumb{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-18deg) scale(1.15)}93%{transform:rotate(8deg)}}\n  .sec-t{font-size:18px !important;font-weight:800 !important;letter-spacing:-.2px;color:var(--ink) !important}\n  .pill-link{background:var(--tint);color:var(--blue) !important;font-weight:600 !important;padding:6px 12px;border-radius:999px;line-height:16px}\n  /* stories */\n  .story{border-radius:28px;padding:14px;transition:transform .5s cubic-bezier(.3,.7,.2,1), top .5s, opacity .3s, background .4s}\n  .story.p1{transform:translateX(calc(-50% - 22px)) rotate(-4deg);background:#fff6d6}\n  .story.p2{transform:translateX(calc(-50% + 22px)) rotate(4deg);background:#e2f5e8}\n  .story .ph{border-radius:20px}\n  .chip{transform:rotate(-4deg);border:2px solid white;left:12px;top:12px}\n  .read-btn,.like{border-radius:999px !important}\n  .heart-fly{position:absolute;width:14px;height:14px;pointer-events:none;z-index:200}\n  .heart-fly path{fill:var(--coral)}\n  /* programme tiles */\n  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n  .tile{position:relative;border-radius:24px;padding:14px 14px 16px;min-height:150px;cursor:pointer;overflow:hidden;transition:transform .2s}\n  .tile:active{transform:scale(.97)}\n  .tile.t-blue{background:linear-gradient(160deg,#eaf1fe 0%,#d6e4fd 100%)}\n  .tile.t-teal{background:linear-gradient(160deg,#e2f5e8 0%,#c8ecd4 100%)}\n  .tile:before{content:\"\";position:absolute;width:110px;height:110px;border-radius:50%;right:-36px;bottom:-40px;background:rgba(255,255,255,.55)}\n  .tile-ic{width:54px;height:54px;border-radius:16px;overflow:hidden;position:relative;transform:rotate(-6deg);box-shadow:0 8px 16px -6px rgba(29,97,225,.35);background:white;margin-bottom:14px;transition:transform .3s}\n  .tile:hover .tile-ic{transform:rotate(4deg) scale(1.05)}\n  .t-teal .tile-ic{transform:rotate(6deg)}\n  .tile-t{font-size:15px;font-weight:700;color:var(--ink);line-height:19px;position:relative}\n  .tile .sub{position:relative;font-size:12px;color:var(--mute);line-height:15px;margin-top:4px}\n  .tile-go{position:absolute;right:12px;top:14px;width:30px;height:30px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(29,97,225,.15)}\n  /* Q2 */\n  .q2{border-radius:28px !important}\n  .q2 .blob{position:absolute;border-radius:50%;background:rgba(246,204,69,.18)}\n  .days{transform:rotate(4deg);box-shadow:0 4px 10px rgba(0,0,0,.2)}\n  .track{position:relative;height:14px;border-radius:999px;background:rgba(255,255,255,.22);margin:6px 0 4px}\n  .track .fill{position:relative;height:100%;width:0;border-radius:999px;transition:width 1.4s cubic-bezier(.3,.7,.2,1);\n    background:repeating-linear-gradient(-45deg,var(--sun) 0 10px,var(--sun-hi) 10px 20px);background-size:28px 28px;animation:stripe 1.2s linear infinite}\n  .track .ms{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.7)}\n  .rider{position:absolute;right:-15px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--sun);border:3px solid white;box-shadow:0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;animation:bob 1.6s ease-in-out infinite}\n  @keyframes bob{50%{transform:translateY(-3px)}}\n  .q2 .share-smile{border-radius:999px !important}\n  .draft{border-radius:999px !important}\n  /* toggle + podium */\n  .seg{border-radius:999px}.seg .knob{border-radius:999px}\n  .pillar{border-radius:22px 22px 0 0 !important}\n  .av{border-radius:50%}\n  .medal{position:absolute;right:-4px;bottom:-2px;width:22px;height:22px;border-radius:50%;border:2px solid white;color:white;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.2)}\n  .m1{background:#e8b21f}.m2{background:var(--blue)}.m3{background:var(--teal)}\n  .confetti img{animation:sway 4s ease-in-out infinite}\n  @keyframes sway{50%{transform:translateY(4px) rotate(2deg)}}\n  /* nav + fab */\n  .nav{bottom:12px !important;width:361px !important;border-radius:999px !important;box-shadow:0 10px 30px -8px rgba(15,27,45,.25) !important;padding:8px 10px !important}\n  .nav > div:first-child{border-radius:999px !important}\n  .fab{border-radius:999px !important;background:linear-gradient(135deg,#195EBE,#008632) !important}\n  .fab-wrap{bottom:92px !important;right:calc(50% - 180px) !important}\n\n  /* ===== v4: corporate calm ===== */\n  body{background:#e9eef5}\n  .phone-wrap{background:linear-gradient(180deg,#f3f7fe 0%,#ffffff 30%,#f7fbff 62%,#eef7f8 100%) !important}\n  .main{background:transparent !important}\n  .wave path{fill:#f3f7fe}\n  .smile-emoji{animation:none}\n  .chip{transform:none;border:none;left:10px;top:10px;background:rgba(15,27,45,.62);color:white;font-weight:500;backdrop-filter:blur(6px);box-shadow:none}\n  .story{border-radius:24px}\n  .story.p1{transform:translateX(calc(-50% - 24px)) rotate(-2deg);background:#f7f9fd}\n  .story.p2{transform:translateX(calc(-50% + 24px)) rotate(2deg);background:#f5fafb}\n  .story .ph{border-radius:16px}\n  .sec-t{font-size:17px !important;font-weight:700 !important;letter-spacing:0}\n  .pill-link{background:transparent;padding:6px 4px;font-weight:500 !important}\n  .streak{background:rgba(255,255,255,.12);font-weight:600}\n  .tile{border-radius:20px;background:white !important;border:1px solid rgba(29,97,225,.10);box-shadow:0 6px 18px -8px rgba(29,97,225,.25)}\n  .tile.t-blue{background:linear-gradient(160deg,#ffffff 0%,#eef4fe 100%) !important}\n  .tile.t-teal{background:linear-gradient(160deg,#ffffff 0%,#eaf7ee 100%) !important}\n  .tile:before{background:rgba(29,97,225,.04)}\n  .tile-ic,.t-teal .tile-ic,.tile:hover .tile-ic{transform:none;border-radius:14px;width:48px;height:48px;box-shadow:0 4px 10px -4px rgba(29,97,225,.3)}\n  .tile-go{box-shadow:none;background:#eef3fb}\n  .q2{border-radius:24px !important}\n  .q2 .blob{background:rgba(255,255,255,.06)}\n  .days{transform:none;box-shadow:none;background:rgba(246,204,69,.95);font-weight:600}\n  .rider{width:20px;height:20px;margin-top:-10px;right:-10px;background:white;border:4px solid var(--sun);animation:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}\n  .track .ms{background:rgba(255,255,255,.45)}\n  .draft{border-style:solid !important;border-color:rgba(29,97,225,.25) !important;background:rgba(234,241,254,.7) !important}\n  .confetti{opacity:.55}.confetti img{animation:none}\n  .crown-glow{animation:none;opacity:.6}\n  .medal{width:20px;height:20px;font-size:10px}\n  .pts{font-size:11px}\n  .pl-1 .pts{color:#a57c0a}\n\n  /* ===== v5: gradient blend + light glass ===== */\n  .phone-wrap{background:linear-gradient(180deg,#edf3fc 0%,#f6f9fd 35%,#f4faf6 70%,#ebf6ef 100%) !important}\n  .hero-bg{-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 66%,rgba(0,0,0,.35) 84%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 66%,rgba(0,0,0,.35) 84%,transparent 100%)}\n  .field{position:absolute;border-radius:50%;z-index:0;pointer-events:none;filter:blur(8px)}\n  .glass{background:rgba(255,255,255,.58) !important;-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) s #0b7a6a,#195EBE) !important}\n\n  /* ===== v8: bolt CTA, micro-interactions, daily spin, director ===== */\n  .cta-sun{background:rgba(255,255,255,.96) !important;overflow:hidden;box-shadow:0 14px 30px -12px rgba(8,40,90,.55), inset 0 1px 0 #fff !important}\n  .cta-sun:after,.q2 .share-smile:after{content:\"\";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,240,170,.75),rgba(255,255,255,0));transform:skewX(-20deg);animation:shine 5.5s 1.8s ease-in-out infinite}\n  .q2 .share-smile{overflow:hidden}\n  @keyframes shine{0%{left:-60%}22%,100%{left:130%}}\n  .bolt{display:inline-flex;filter:drop-shadow(0 2px 3px rgba(217,130,10,.45));animation:charge 5.5s 1.8s ease-in-out infinite}\n  .bolt.sm{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}\n  @keyframes charge{0%,100%{transform:none}4%{transform:scale(1.18) rotate(-8deg)}8%{transform:scale(.96) rotate(4deg)}12%{transform:none}}\n  .share-smile.zap .bolt{animation:zap .5s ease-out}\n  @keyframes zap{30%{transform:scale(1.35) rotate(-14deg);filter:drop-shadow(0 0 8px rgba(255,210,60,.95))}100%{transform:none}}\n  .ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(25,94,190,.18);pointer-events:none;animation:rip .6s ease-out forwards}\n  @keyframes rip{to{transform:scale(1);opacity:0}}\n  .read-btn,.tile,.draft,.fab,.spin-btn,.dir-more,.dir-play{position:relative;overflow:hidden}\n  .bell{transform-origin:50% 12%;animation:ring 1s 1.2s ease-in-out 1}\n  .bell.go{animation:ring .9s ease-in-out 1}\n  @keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}}\n  .rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1)}\n  .rv.in{opacity:1;transform:none}\n  .tile-go{transition:transform .25s}\n  .tile:hover .tile-go,.tile:active .tile-go{transform:transla ildList:true,characterData:true,subtree:true});\n});\n<\/script>\n\n<script>\n$(function(){\n  var $pw=$('.phone-wrap');\n  function toast(t){ var $t=$('.toast').text(t).addClass('show'); clearTimeout($t.data('t')); $t.data('t',setTimeout(function(){ $t.removeClass('show'); },2200)); }\n  window.toast=toast;\n  function relPos(el){ var r=el.getBoundingClientRect(), w=$pw[0].getBoundingClientRect(); return {x:r.left-w.left+r.width/2, y:r.top-w.top}; }\n\n  // Hero parallax (pointer)\n  var hb=$('.hero-bg')[0];\n  $pw.on('pointermove',function(e){ if(window.scrollY>400) return; var w=this.getBoundingClientRect(); hb.style.setProperty('--px',((e.clientX-w.left)/w.width-.5).toFixed(3)); hb.style.setProperty('--py',((e.clientY-w.top)/500-.5).toFixed(3)); });\n\n  // Compact header after hero\n  var hio=new IntersectionObserver(function(es){ $('.mini-head').toggleClass('show',!es[0].isIntersecting); },{rootMargin:'-60px 0px 0px 0px'});\n  hio.observe($('.toprow')[0]);\n\n  // Nav: sliding indicator\n  function placeInd(){ var $on=$('.nt.on'); if(!$on.length) return; $('.nav-ind').css({left:$on.position().left,width:$on.outerWidth()}); }\n  setTimeout(placeInd,50); $(window).on('resize load',placeInd);\n  $('.nt').on('click',function(){ var $b=$(this);\n    if($b.hasClass('on') && $b.data('t')==='Home'){ $('html,body').animate({scrollTop:0},500); return; }\n    $('.nt').removeClass('on').removeAttr('aria-current'); $b.addClass('on').attr('aria-current','page');\n    var tries=0; (function loop(){ placeInd(); if(tries++<22) requestAnimationFrame(loop); })();\n    if($b.data('t')!=='Home') toast($b.data('t')+' opens in the full app');\n  });\n\n  // Bell -> notifications popover\n  $('.bell').on('click',function(e){ e.stopPropagation(); $('.notif').toggleClass('open'); });\n  $(document).on('click',function(e){ if(!$(e.target).closest('.notif,.bell').length) $('.notif').removeClass('open'); });\n  $('.nf-mark').on('click',function(){ $('.nf-i').removeClass('un'); $('.toprow .bell').siblings().end(); $('.notif').removeClass('open'); toast('All caught up'); $('.bell').parent().parent().find('.bell').addClass('read'); });\n  $('.nf-i').on('click',function(){ $(this).removeClass('un'); });\n\n  // Share a smile -> compose sheet\n  var draft=\"Rohan coordinated with the field crew to restore power for a dialysis patient in 40 minutes.\";\n  var mode='smile';\n  function setMode(m){ mode=m; var p=m==='practice', $c=$('#sheet-compose');\n    $c.attr('aria-label',p?'Share a best practice':'Share a smile');\n    $c.find('.spin-head .sec-t').text(p?'Share a best practice':'Share a smile');\n    $c.find('.spin-head .spin-sub').text(p?'A way of working others can learn from.':'Tell us who made a customer smile.');\n    $c.find('.lbl-s').eq(0).toggle(!p); $c.find('.pchips').toggle(!p);\n    $c.find('.lbl-s').eq(1).text(p?'What do you do?':'What happened?');\n    $c.find('.ta').attr('placeholder',p?'When a customer\u2026 we always\u2026':'A customer called in about\u2026 and they\u2026');\n    $c.find('.pb-t').text(p?'Post best practice':'Post story');\n    $c.find('.done-t').text(p?'Best practice shared!':'Smile shared!');\n    $c.find('.done-s').text(p?'It is on its way to your assessor.':\"Your story is on its way to the Q2 jury.\");\n  }\n  function resetCompose(pref){ $('.cmp').removeClass('done'); $('.pchip').removeClass('on'); $('.ta').val(pref||''); validate(); }\n  // Every Share button first asks: a smile or a best practice?\n  $(document).on('click','.share-smile,.share-open',function(){ var $t=$(this); setTimeout(function(){ openSheet('#sheet-choose'); }, $t.hasClass('cta-sun')?180:0); });\n  $('.ch-opt').on('click',function(){ setMode($(this).data('m')); resetCompose(); openSheet('#sheet-compose'); setTimeout(function(){ $('.ta').trigger('focus'); },450); });\n  $('.draft-link').on('click',function(e){ e.stopPropagation(); setMode('smile'); resetCompose(draft); $('.pchip').first().addClass('on'); validate(); openSheet('#sheet-compose'); });\n  $('.pchip').on('click',function(){ $(this).toggleClass('on'); validate(); });\n  function validate(){ var n=$('.ta').val().length, who=mode==='practice'||$('.pchip.on').length>0, ok=n>=20 && who;\n    $('.cnt b').text(n); $('.cnt').toggleClass('ok',n>=20); $('.hint').text(n>=20?(who?'Looks great':'Pick a colleague'):'Min. 20 characters');\n    $('.post-btn').prop('disabled',!ok); }\n  $('.ta').on('input',validate);\n  $('.add-photo').on('click',function(){ toast('Photo upload opens in the full app'); });\n  $('.post-btn').on('click',function(){ var $b=$(this).addClass('busy');\n    setTimeout(function(){ $b.removeClass('busy'); $('.cmp').addClass('done');\n      var $p=$('.done-p b'); $({v:0}).animate({v:10},{duration:800,step:function(v){ $p.text(Math.round(v)); }});\n      var o=relPos($('.okc')[0]); burstFrom(o.x,o.y+40); },900); });\n  $('.done-btn').on('click',function(){ closeSheet(); toast(mode==='practice'?'Thanks for sharing a best practice':'Thanks for sharing a smile'); });\n\n  function burstFrom(cx,cy){ var c=['#f6cc45','#008632','#195EBE','#4a95ff'];\n    for(var k=0;k<16;k++){ var a=Math.PI*2*k/16, d=60+Math.random()*40;\n      $('<span class=\"burst\">').css({left:cx,top:cy,width:6,height:6,background:c[k%4]}).appendTo($pw)\n        .animate({left:cx+Math.cos(a)*d,top:cy+Math.sin(a)*d,opacity:0},750,function(){ $(this).remove(); }); } }\n\n  // Read story -> story sheet\n  $(document).on('click','.read-btn',function(e){ e.stopPropagation(); var $c=$(this).closest('.story');\n    $('#sheet-story .st-ph img').attr('src',$c.find('.ph img').attr('src'));\n    $('#sheet-story .st-t').text($c.find('p').first().text());\n    var $a=$c.find('.story-actions').prev(); $('#sheet-story .st-a img').attr('src',$a.find('img').attr('src')); $('#sheet-story .st-n').text($a.find('p').text());\n    $('.cheer-btn').removeClass('on').find('.cc').text(12);\n    openSheet('#sheet-story'); });\n  $('.cheer-btn').on('click',function(){ var $b=$(this), on=!$b.hasClass('on'), $c=$b.find('.cc'); $b.toggleClass('on',on); $c.text(+$c.text()+(on?1:-1)); if(on){ var o=relPos(this); burstFrom(o.x,o.y+25); } });\n\n  // Stories: autoplay with progress dot, paused on touch / hover / offscreen\n  var $stack=$('.stack'), timer=null, visible=true;\n  function arm(){ clearTimeout(timer); if(!visible||$stack.hasClass('paused')||$('body').hasClass('sheet-open')) return; timer=setTimeout(function(){ $('.story.p1').trigger('click'); setTimeout(arm,600); },5000); }\n  $stack.on('pointerenter pointerdown',function(){ $stack.addClass('paused'); clearTimeout(timer); })\n        .on('pointerleave',function(){ $stack.removeClass('paused'); restartDot(); arm(); });\n  function restartDot(){ var $d=$('.dots span.on'); $d.removeClass('on'); void $d[0].offsetWidth; $d.addClass('on'); }\n  new MutationObserver(function(){ arm(); }).observe($('.dots')[0],{attributes:true,subtree:true,attributeFilter:['class']});\n  new IntersectionObserver(function(es){ visible=es[0].isIntersecting; if(visible) arm(); else clearTimeout(timer); },{threshold:.5}).observe($stack[0]);\n  arm();\n\n  // Tilt on tiles, spin card, director card\n  $('.tile,.spin-card,.dir').addClass('tilt').on('pointermove',function(e){ if(e.pointerType==='touch') return; var r=this.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;\n      this.style.transform='perspective(700px) rotateX('+(-y*5)+'deg) rotateY('+(x*6)+'deg)'; })\n    .on('pointerleave',function(){ this.style.transform=''; });\n\n  // Q2 percent count-up\n  new IntersectionObserver(function(es,o){ if(es[0].isIntersecting){ var $p=$('.pct'); $({v:0}).animate({v:87},{duration:1300,step:function(v){ $p.text(Math.round(v)); }}); o.disconnect(); } },{threshold:.5}).observe($('.q2')[0]);\n\n  // Podium: tap an avatar to cheer\n  $('.podium .av').on('click',function(){ var o=relPos(this), n=$(this).closest('.who').find('.nm').text();\n    $('<span class=\"plus1\">+1 cheer<\/span>').css({left:o.x-34,top:o.y}).appendTo($pw).animate({top:o.y-46,opacity:0},900,function(){ $(this).remove(); });\n    var $pt=$(this).closest('.who').find('.pts'), m=$pt.text().match(/\\d+/); if(m) $pt.text((+m[0]+1)+' smiles');\n    toast('You cheered for '+n.split(' ')[0]); });\n\n  // Director video + programme tiles\n  $('.dir-play').on('click',function(){ toast('Video opens in the full app'); });\n  $('.tile').on('click',function(){ toast($(this).find('.tile-t').text()+' opens in the full app'); });\n});\n<\/script>\n<\/body>\n<\/html>"}</script>
<script>
(function(){
  var SRC=JSON.parse(document.getElementById('screens').textContent), IM=JSON.parse(document.getElementById('imgs').textContent), CACHE={};
  function html(k){ if(!CACHE[k]){ CACHE[k]=SRC[k].replace(/__I(\d+)__/g,function(m,i){ return IM[+i]; }); } return CACHE[k]; }
  var dev=document.getElementById('dev');
  var TABS=['home','explore','bin','champions','profile'];
  var NAV={Home:'home',Explore:'explore',Rewards:'bin',Bin:'bin',Awards:'champions',Champions:'champions',Profile:'profile'};
  var tabs={}, cur='home', stack=[];

  function toast(t){ var e=document.getElementById('pt'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(function(){ e.classList.remove('show'); },2400); }
  function make(k){ var f=document.createElement('iframe'); f.className='scr off'; f.title=k; f.setAttribute('data-k',k);
    f.addEventListener('load',function(){ wire(f,k); }); f.srcdoc=html(k); dev.insertBefore(f,document.getElementById('sbg')); return f; }
  function top(){ return stack.length?stack[stack.length-1]:tabs[cur]; }

  /* Tabs: switch instantly with a soft fade; pushed screens are cleared */
  function tab(k){ if(k!=='home'){ toast('This preview shows the homepage only'); return; }
    while(stack.length){ var s=stack.pop(); s.remove(); }
    tabs[cur].classList.remove('left'); tabs[cur].classList.add('top');
    if(k===cur){ var w=tabs[k].contentWindow; try{ (w.document.querySelector('.phone-wrap')||w.document.scrollingElement).scrollTo({top:0,behavior:'smooth'}); }catch(e){} return; }
    var from=tabs[cur]; if(!tabs[k]) tabs[k]=make(k);
    var to=tabs[k]; to.classList.remove('off','right','left'); to.classList.add('fade','top'); from.classList.remove('top');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ to.classList.remove('fade'); }); });
    setTimeout(function(){ from.classList.add('off'); },260);
    cur=k;
  }
  /* Push: new screen slides in from the right */
  function push(k){ if(k!=='home'){ toast('This preview shows the homepage only'); return; } var below=top(), f=make(k); f.classList.remove('off'); f.classList.add('right','top'); stack.push(f);
    var go=function(){ requestAnimationFrame(function(){ f.classList.remove('right'); below.classList.add('left'); below.classList.remove('top'); }); };
    f.addEventListener('load',go,{once:true}); }
  function back(){ if(!stack.length) return; var f=stack.pop(), below=top();
    below.classList.remove('left','off'); below.classList.add('top'); f.classList.add('right');
    setTimeout(function(){ f.remove(); },400); }

  /* Share chooser for Explore and Bin */
  function chooser(o){ dev.classList.toggle('s-open',o); }
  document.getElementById('sbg').onclick=document.getElementById('sx').onclick=function(){ chooser(false); };
  [].forEach.call(document.querySelectorAll('.ch'),function(b){ b.onclick=function(){ chooser(false);
    if(b.dataset.m==='smile') push('share');
    else { tab('home'); setTimeout(function(){ homeDo(function(d){ var o=d.querySelector('.ch-opt[data-m="practice"]'); if(o) o.click(); }); },300); } }; });
  function homeDo(fn){ var f=tabs.home; try{ fn(f.contentWindow.document,f.contentWindow); }catch(e){} }

  /* Routes: what each tap does on each screen. Anything not listed keeps the screen's own behaviour. */
  function navTo(el){ var k=NAV[el.getAttribute('data-t')]; if(!k) return false; tab(k); }
  var R={
    home:[
      ['.nav .nt',function(el){ if(el.getAttribute('data-t')==='Home') return false; return navTo(el); }],
      ['.read-btn',function(){ push('story'); }],
      ['.pill-link',function(el){ var x=el.textContent.trim(); if(x==='Leaderboard') tab('champions'); else if(x==='View all') tab('explore'); else return false; }],
      ['.tile',function(el){ var t=el.querySelector('.tile-t'), x=t?t.textContent.trim():''; if(x==='Important dates') push('dates'); else if(x==='Participation dashboard') push('dash'); else return false; }],
      ['.ch-opt[data-m="smile"]',function(el,d){ var bg=d.querySelector('.sheet-bg'); if(bg) bg.click(); push('share'); }],
      ['.draft-link',function(){ push('share'); }]
    ],
    explore:[['.nav .nt',navTo],['.read-btn',function(){ push('story'); }],['.js-share',function(){ chooser(true); }]],
    bin:[['.nav .nt',navTo],['.js-edit',function(){ push('share'); }],['.js-share',function(){ chooser(true); }]],
    champions:[['.nav .nt',navTo],['.row,.who',function(el){ if(/Rohan/.test(el.textContent)) push('story'); else return false; }]],
    profile:[['.nav .nt',navTo],
      ['.js-row',function(el){ var t=el.getAttribute('data-t');
        if(t==='My story status'||t==='Your stories') push('status');
        else if(t==='Notifications'){ tab('home'); setTimeout(function(){ homeDo(function(d,w){ w.scrollTo({top:0}); var b=d.querySelector('.bell'); if(b) b.click(); }); },320); }
        else return false; }]],
    story:[['.js-back',back]],
    dash:[['.js-back',back]],
    dates:[['.js-back',back]],
    status:[['.js-back',back],['.card',function(el){ var g=el.getAttribute('data-go'); if(g==='chg') tab('bin'); else if(g==='draft') push('share'); else push('story'); }]],
    share:[['.js-back',back],
      ['.js-go',function(el){ if(!el.classList.contains('ready')) return false; back(); setTimeout(function(){ toast('Your story was submitted for review'); },350); }],
      ['.js-draft',function(){ back(); setTimeout(function(){ toast('Saved to your drafts'); },350); }]]
  };
  function wire(f,k){
    var w=f.contentWindow, d=w.document, routes=R[k]||[];
    w.addEventListener('click',function(e){
      for(var i=0;i<routes.length;i++){ var el=e.target.closest&&e.target.closest(routes[i][0]);
        if(el && routes[i][1](el,d,w)!==false){ e.preventDefault(); e.stopImmediatePropagation(); return; } }
    },true);
  }

  tabs.home=make('home'); tabs.home.classList.remove('off'); tabs.home.classList.add('top');
  tabs.home.addEventListener('load',function(){ var b=document.getElementById('boot'); b.style.opacity=0; setTimeout(function(){ b.remove(); },300); },{once:true});
})();
</script>
</body>
